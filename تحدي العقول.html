<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>تحدي العقول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--cy:#22d3ee;--mg:#e879f9;--gold:#fbbf24;--tx:#f5f3ff;--mu:#a8a1c4;--l1:#34d399;--l2:#38bdf8;--l3:#fb7185;--rc:#22d3ee;--cc:#a78bfa;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(1000px 600px at 5% -10%,#5b21b688,transparent 60%),radial-gradient(900px 500px at 100% 105%,#0e749077,transparent 60%),#07040f;background-attachment:fixed;color:var(--tx);font-family:Cairo,Tahoma,sans-serif;transition:background .6s}
body.g{background:radial-gradient(900px 560px at 50% -5%,#fbbf2466,transparent 65%),repeating-conic-gradient(from 0deg at 50% -20%,#fbbf2410 0 6deg,transparent 6deg 12deg),#050302;background-attachment:fixed;--rc:#fbbf24;--cc:#fbbf24}
#app{max-width:1300px;margin:auto;padding:18px;animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1}}
@keyframes glow{50%{text-shadow:0 0 40px var(--gold),0 0 90px #fbbf2499}}
@keyframes pop{40%{transform:scale(1.2);color:#fff}}
@keyframes fl{50%{transform:translateY(-12px) rotate(4deg)}}
h1.logo{font-size:clamp(2.8rem,9vw,6.5rem);font-weight:900;margin:.1em 0;background:linear-gradient(90deg,var(--cy),var(--mg),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px #e879f988)}
.c{text-align:center}.home{min-height:75vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}
.brain{font-size:5.5rem;animation:fl 3.5s infinite}
button{font-family:inherit;cursor:pointer;border:1px solid #ffffff33;background:#ffffff12;color:var(--tx);padding:10px 20px;border-radius:999px;font-size:1rem;font-weight:700;transition:.2s;backdrop-filter:blur(6px)}
button:hover:not(:disabled){transform:translateY(-2px) scale(1.03);box-shadow:0 0 24px #22d3ee66;border-color:var(--cy)}
button:disabled{opacity:.3;cursor:not-allowed}
.gold{background:linear-gradient(135deg,#fde68a,#fbbf24 45%,#f97316);color:#1a0f00;border:0}.red{border-color:#fb7185;color:#fda4af}
.big{font-size:1.2rem;padding:14px 32px;min-width:min(330px,90vw)}
.card{background:linear-gradient(145deg,#ffffff14,#ffffff06);backdrop-filter:blur(14px);border:1px solid #ffffff22;border-radius:26px;padding:20px;margin:14px 0;box-shadow:0 14px 50px #0008}
body.g .card{border-color:#fbbf2466;box-shadow:0 0 50px #fbbf2433}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px}.bar h2{margin:0;font-size:1.7rem;background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent}
.lg button{padding:6px 12px;font-size:.85rem;margin:0 2px}.lg .on{background:var(--cy);color:#04141a;border-color:var(--cy)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.hd{background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 55%,#000),#0c0620);border:1px solid var(--cc);border-radius:18px;text-align:center;padding:14px 4px;font-weight:900;font-size:.95rem;box-shadow:0 0 22px color-mix(in srgb,var(--cc) 40%,transparent)}.hd span{display:block;font-size:2.3rem}
.cell{font-size:1.9rem;font-weight:900;padding:22px 0;border-radius:18px;background:#0e0820;color:var(--lc);border:2px solid var(--lc);box-shadow:0 0 16px color-mix(in srgb,var(--lc) 35%,transparent),inset 0 0 20px color-mix(in srgb,var(--lc) 15%,transparent);text-shadow:0 0 14px var(--lc)}
.cell:hover:not(:disabled){background:var(--lc);color:#07040f;text-shadow:none}.l1{--lc:var(--l1)}.l2{--lc:var(--l2)}.l3{--lc:var(--l3)}
.cell.used{opacity:.12;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{border-width:2px}.chip.on{background:var(--gold);color:#111}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:16px 0}
.pc{padding:22px 10px;font-size:1.05rem;position:relative;border-radius:22px;border:2px solid var(--cc);background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 30%,#0c0620),#0c0620)}.pc span{display:block;font-size:2.8rem}.pc.on{background:linear-gradient(160deg,var(--cc),color-mix(in srgb,var(--cc) 50%,#000));box-shadow:0 0 34px var(--cc);color:#fff}.pc i{position:absolute;top:8px;inset-inline-end:12px;font-style:normal}
.q{font-size:clamp(1.7rem,4.2vw,3.4rem);font-weight:900;text-align:center;margin:10px 0;line-height:1.5}
.ans{font-size:2.4rem;color:var(--gold);font-weight:900;text-align:center;margin:12px}
.ring{--p:100;width:160px;height:160px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--p)*1%),#ffffff14 0);box-shadow:0 0 40px color-mix(in srgb,var(--rc) 45%,transparent)}.ring.low{--rc:#fb7185;animation:pop 1s infinite}
.ring div{width:136px;height:136px;border-radius:50%;background:#07040f;display:grid;place-items:center;font-size:3.8rem;font-weight:900;color:var(--rc)}
.row{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:20px;background:#ffffff0d;margin:8px 0;border:1px solid #ffffff1a}
.row.first{background:linear-gradient(90deg,#fbbf2440,#ffffff08);border-color:var(--gold);box-shadow:0 0 30px #fbbf2455}
.sc{font-size:1.9rem;font-weight:900;color:var(--gold);min-width:90px;text-align:center}.sc.p{animation:pop .6s}
.dot{width:16px;height:16px;border-radius:50%;flex:none;display:inline-block}.grow{flex:1;font-weight:700;font-size:1.2rem}
input,select,textarea{font-family:inherit;background:#0c0620;color:var(--tx);border:1px solid #ffffff33;border-radius:14px;padding:10px;font-size:1rem;width:100%;margin:4px 0}
img.qi{display:block;max-height:34vh;max-width:100%;margin:auto;border-radius:16px;transition:filter 1s}
.rl{display:flex;gap:14px;align-items:center;font-size:1.2rem}.rl b{background:linear-gradient(135deg,var(--cy),var(--mg));color:#07040f;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;flex:none}
.fin{animation:fi .8s}.win{font-size:clamp(2.5rem,7vw,5rem);color:var(--gold);font-weight:900;animation:glow 2s infinite}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
@media(max-width:700px){.grid{gap:5px}.hd{font-size:.6rem;padding:6px 2px;border-radius:10px}.hd span{font-size:1.4rem}.cell{font-size:1.05rem;padding:12px 0;border-radius:10px}}
.md{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:99}.mb{background:#150c2e;border:1px solid var(--cy);border-radius:24px;padding:24px;max-width:min(460px,92vw);font-size:1.15rem;text-align:center;box-shadow:0 0 60px #22d3ee55}.tt{position:fixed;bottom:24px;inset-inline:0;margin:auto;width:max-content;max-width:92vw;background:var(--gold);color:#111;padding:12px 22px;border-radius:999px;font-weight:900;z-index:100;opacity:0;pointer-events:none;transition:.3s}.tt.on{opacity:1}

function start(){if(!S.teams.length){al(t('need'));return go('teams')}SFX.go();go('pick')}
function rules(){return nav('rules')+`<div class="card">${RU.map((r,i)=>`<div class="rl" style="margin:14px 0"><b>${i+1}</b>${r.split('|')[S.li]}</div>`).join('')}</div><div class="c"><button class="gold big" onclick="start()">${t('start')}</button></div>`}
function pick(){const n=S.sel.length;return nav('pk')+`<p class="c" style="color:var(--mu);font-size:1.2rem">${t('pkh')}</p><div class="pg">${PICK.map(i=>{const on=S.sel.includes(i);return`<button class="pc ${on?'on':''}" style="--cc:${CATCOL[i]}" onclick="tp(${i})">${on?'<i>✔</i>':''}<span>${CATS[i][1]}</span>${cn(i)}</button>`}).join('')}</div><div class="c"><p style="font-size:1.6rem;font-weight:900;color:var(--gold)">${n} / 6</p><button class="gold big" ${n==6?'':'disabled'} onclick="SFX.go();go('board')">${t('go')}</button></div>`}
function tp(i){const k=S.sel.indexOf(i);if(k>=0)S.sel.splice(k,1);else if(S.sel.length>=6){al(t('max'));return}else S.sel.push(i);SFX.pick();save();R()}
function teams(){return nav('teams')+`<div class="card"><div style="display:flex;gap:8px"><input id="tn" placeholder="${t('tname')}" onkeydown="if(event.key=='Enter')addT()"><button class="gold" onclick="addT()">${t('add')}</button></div></div>`+(S.teams.map(x=>`<div class="row"><span class="grow">${T(x)}</span><button onclick="symT(${x.id})">🎨</button><button onclick="renT(${x.id})">✏️</button><button class="red" onclick="delT(${x.id})">🗑️</button></div>`).join('')||`<p class="c">${t('nt')}</p>`)+(S.teams.length?`<div class="c" style="margin:16px"><button class="red" onclick="clrT()">${t('clrT')}</button></div>`:'')}
function addT(){const n=document.getElementById('tn').value.trim();if(!n)return;const i=S.teams.length;S.teams.push({id:Date.now(),name:n,color:COL[i%8],sym:SYM[i%8],score:0});save();R()}
function renT(id){const x=S.teams.find(a=>a.id==id);pr(t('rn'),x.name,n=>{if(n&&n.trim()){x.name=n.trim();save();R()}})}
function symT(id){const x=S.teams.find(a=>a.id==id),i=(SYM.indexOf(x.sym)+1)%8;x.sym=SYM[i];x.color=COL[i];save();R()}
function delT(id){cf(t('dt'),()=>{S.teams=S.teams.filter(a=>a.id!=id);save();R()})}
function clrT(){cf(t('clrc'),()=>{S.teams=[];save();R()})}
function resetGame(){cf(t('rstc'),()=>{S.teams.forEach(x=>x.score=0);S.qs.forEach(q=>q.u=0);Q=null;save();go(S.teams.length?'pick':'teams')})}
function mini(){return`<div class="chips">${rank().map(x=>`<span class="row" style="margin:0;border:1px solid ${x.color}">${T(x)} <b style="color:var(--gold)">${x.score}</b></span>`).join('')}</div>`}
function board(){const g=S.qs.filter(q=>q.c==6&&!q.u);let h=nav('bd')+`<div class="grid">`+S.sel.map(c=>`<div class="hd" style="--cc:${CATCOL[c]}"><span>${CATS[c][1]}</span>${cn(c)}</div>`).join('');
for(let r=0;r<6;r++)S.sel.forEach(c=>{const q=S.qs.filter(x=>x.c==c).sort((a,b)=>a.l-b.l)[r];h+=q?`<button class="cell l${q.l} ${q.u?'used':''}" onclick="open_(${q.id})">${q.u?'✔':PTS[q.l]}</button>`:`<div></div>`});
return h+`</div><div class="chips" style="margin:16px">${g.length?`<button class="gold big" onclick="open_(${g[0].id})">${t('gq')} (${g.length})</button>`:''}<button onclick="go('pick')">${t('chg')}</button><button onclick="go('scores')">${t('scores')}</button><button class="red" onclick="resetGame()">${t('rst')}</button></div>${mini()}`}
function open_(id){SFX.pick();const mx=CATLV(S.qs.find(x=>x.id==id).c);Q={id,t:mx,mx,run:0,rev:0,team:null};V='q';R()}
const cq=()=>S.qs.find(x=>x.id==Q.id);
function qv(){const q=cq();return`<div class="bar"><button onclick="go('board')">${t('back')}</button><h2>${CATS[q.c][1]} ${cn(q.c)} · ${PTS[q.l]} ${t('pts')}</h2><button onclick="tg()">${S.snd?'🔊':'🔇'}</button></div>
<div class="ring" id="rg"><div id="tm">${Q.t}</div></div><div class="card"><div class="q">${esc(ql(q.q))}</div>${q.img?`<img class="qi" id="im" src="${q.img}" alt="">`:''}<div class="ans" id="an">${Q.rev?esc(ql(q.a)):'???'}</div></div>
<div class="chips" style="margin:10px"><button class="gold" onclick="tmr(1)">${t('st')}</button><button onclick="tmr(0)">${t('pa')}</button><button onclick="tmr(2)">${t('rs')}</button><button onclick="rv()">${t('sh')}</button></div>
<div class="card"><p class="c" style="margin:0 0 8px">${t('pickT')}</p><div class="chips">${S.teams.map(x=>`<button class="chip ${Q.team==x.id?'on':''}" style="${Q.team==x.id?'':'border-color:'+x.color}" onclick="Q.team=${x.id};R()">${x.sym} ${esc(x.name)}</button>`).join('')}</div>
<div class="chips" style="margin-top:12px"><button class="gold" onclick="ans(1)">${t('ok')} +${PTS[q.l]}</button><button class="red" onclick="ans(0)">${t('no')}</button><button onclick="adj(-50)">−50</button><button onclick="adj(50)">+50</button><button onclick="adj(-PTS[cq().l])">−${PTS[q.l]}</button></div></div>
<div class="c" style="margin-bottom:14px"><button class="gold" onclick="done()">${cq().c==6?t('skip'):t('end')}</button></div>${mini()}`}
function rv(){Q.rev=1;const q=cq();document.getElementById('an').textContent=ql(q.a);const im=document.getElementById('im');if(im)im.style.filter='none';SFX.pick()}
function tickUI(){const m=document.getElementById('tm');if(!m)return;m.textContent=Q.t;const r=document.getElementById('rg');r.style.setProperty('--p',Q.t/Q.mx*100);r.className='ring'+(Q.t<=5?' low':'');const im=document.getElementById('im');if(im)im.style.filter=Q.rev?'none':`blur(${Math.round(Q.t/Q.mx*22)}px)`}
function tmr(m){clearInterval(TI);if(m==2){Q.t=Q.mx;Q.run=0}else if(m==1&&Q.t>0){Q.run=1;SFX.pick();TI=setInterval(()=>{Q.t--;if(Q.t<=5&&Q.t>0)SFX.tick();if(Q.t<=0){Q.t=0;clearInterval(TI);SFX.no()}tickUI()},1000)}else Q.run=0;tickUI()}
function sc(id,p){S.teams.find(x=>x.id==id).score+=p;save()}
function ans(ok){clearInterval(TI);if(ok){if(!Q.team)return al(t('selT'));SFX.ok();sc(Q.team,PTS[cq().l]);Q.rev=1;R();confetti(60)}else SFX.no()}
function adj(p){if(!Q.team)return al(t('selT'));sc(Q.team,p);p>0?SFX.ok():SFX.no();R()}
function done(){const g=cq().c==6;cq().u=1;save();if(g){const n=S.qs.find(x=>x.c==6&&!x.u);if(n)return open_(n.id)}go('board')}
function scores(){return nav('scores')+rank().map((x,i)=>`<div class="row ${i==0?'first':''}"><span style="font-size:1.8rem;min-width:40px;text-align:center">${['🥇','🥈','🥉'][i]||i+1}</span><span class="grow">${T(x)}</span><span class="sc ${lastPts[x.id]?'p':''}">${x.score}</span><button onclick="man(${x.id},-50)">−50</button><button onclick="man(${x.id},50)">+50</button><button onclick="man(${x.id},0)">✏️</button></div>`).join('')+(S.teams.length?`<div class="c" style="margin:16px"><button class="gold big" onclick="go('fin')">${t('fin')}</button></div>`:`<p class="c">${t('nt')}</p>`)+(S.hist.length?`<h3 style="color:var(--gold)">${t('hist')}</h3>`+S.hist.map(h=>`<div class="card">${h.d}: ${h.r.map((x,i)=>`${i+1}) ${esc(x[0])} (${x[1]})`).join(' · ')}</div>`).join(''):'')}
function man(id,p){if(p){lastPts={[id]:1};sc(id,p);R();lastPts={}}else{const x=S.teams.find(a=>a.id==id);pr(t('ns'),x.score,n=>{if(n===null||isNaN(+n)||n==='')return;x.score=+n;save();R()})}}
function qadm(){return nav('qs')+`<div class="card"><select id="qc">${CATS.map((c,i)=>`<option value="${i}" ${E.c==i?'selected':''}>${c[1]} ${cn(i)}</option>`).join('')}</select><select id="ql">${[1,2,3].map(i=>`<option value="${i}" ${E.l==i?'selected':''}>${t('lv'+i)}</option>`).join('')}</select><textarea id="qq" rows="2" placeholder="${t('qph')}">${esc(E.q||'')}</textarea><input id="qa" placeholder="${t('aph')}" value="${esc(E.a||'')}"><input type="file" accept="image/*" onchange="im(this)"><div class="chips" style="margin-top:8px"><button class="gold" onclick="sq()">${E.id?t('sv'):t('aq')}</button>${E.id||E.img?`<button onclick="E={};R()">${t('cn')}</button>`:''}</div></div>`+S.qs.map(q=>`<div class="row"><span>${CATS[q.c][1]} ${PTS[q.l]}</span><span class="grow" style="font-size:1rem">${esc(ql(q.q))} <small style="color:var(--mu)">— ${esc(ql(q.a))}</small></span>${q.img?'🖼️':''}<button onclick="eq(${q.id})">✏️</button><button class="red" onclick="dq(${q.id})">🗑️</button></div>`).join('')}
function im(el){const f=el.files[0];if(!f)return;if(f.size>700000)return al(t('big'));const r=new FileReader();r.onload=()=>{E.img=r.result;al(t('imok'))};r.readAsDataURL(f)}
function sq(){const q=document.getElementById('qq').value.trim(),a=document.getElementById('qa').value.trim();if(!q||!a)return al(t('req'));const c=+document.getElementById('qc').value,l=c==6?4:+document.getElementById('ql').value;
if(E.id)Object.assign(S.qs.find(x=>x.id==E.id),{q,a,c,l,img:E.img||''});else S.qs.push({id:Date.now(),c,l,q,a,img:E.img||'',u:0});E={};save();R()}
function eq(id){E={...S.qs.find(x=>x.id==id)};R();scrollTo(0,0)}
function dq(id){cf(t('dq'),()=>{S.qs=S.qs.filter(x=>x.id!=id);save();R()})}
function sets(){return nav('sets')+`<div class="card c"><button class="big" onclick="tg()">${t(S.snd?'snd1':'snd0')}</button></div><div class="card c"><button class="big red" onclick="resetGame()">${t('rst')}</button></div><div class="card c"><button class="big" onclick="newC()">${t('nc')}</button></div><div class="card c"><button class="big" onclick="go('pick')">${t('chg')}</button></div><div class="card c"><button class="big red" onclick="cf(t('rallc'),()=>{const l=S.li;S=mk();S.li=l;save();R()})">${t('rall')}</button></div>`}
function newC(){cf(t('ncc'),()=>{if(S.teams.some(x=>x.score))S.hist.unshift({d:new Date().toLocaleDateString(['ar','fr','en'][S.li]),r:rank().map(x=>[x.name,x.score])});S.teams.forEach(x=>x.score=0);S.qs.forEach(q=>q.u=0);save();go('pick')})}
function startFin(){F={cd:3,rev:0};const n=S.teams.length;if(!n)return;SFX.pick();TI=setInterval(()=>{if(F.cd>0){F.cd--;SFX.tick()}else if(F.rev<n){F.rev++;SFX.pick();if(F.rev==n){clearInterval(TI);SFX.win();confetti(250)}}if(V=='fin')R()},1200)}
function finv(){const r=rank(),n=r.length;if(!n)return nav('')+`<p class="c">${t('nt')}</p>`;let h=`<div class="c">${F.cd>0?`<div class="win" style="font-size:12rem;margin-top:8vh">${F.cd}</div>`:`<h2 style="color:var(--gold);font-size:2.4rem">${t('fr')}</h2>`}`;
if(F.cd<=0)for(let i=0;i<F.rev;i++){const x=r[n-1-i],pos=n-i;h+=pos==1?`<div class="win fin">👑 ${x.sym} ${esc(x.name)}<br>${x.score}</div><p class="fin" style="font-size:2rem;font-weight:900">${t('cong')}</p>`:`<div class="row fin"><b style="font-size:1.6rem;min-width:40px">${pos}</b><span class="grow">${T(x)}</span><span class="sc">${x.score}</span></div>`}
return h+(F.rev==n&&F.cd<=0?`<div class="chips" style="margin:14px"><button class="gold big" onclick="newC()">${t('nc')}</button><button onclick="go('scores')">${t('scores')}</button><button onclick="go('home')">${t('home')}</button></div>`:`<div style="margin:14px"><button onclick="go('scores')">${t('back').replace('⬅ ','⬅ ')==''?'':'⬅'}</button></div>`)+`</div>`}
function confetti(n){const cv=document.getElementById('cv'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const P=[...Array(n)].map(()=>({x:Math.random()*cv.width,y:-20-Math.random()*300,v:2+Math.random()*4,w:6+Math.random()*6,c:COL[Math.random()*8|0],r:Math.random()*6}));let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.y+=p.v;p.r+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(0,0,p.w,p.w*.6);x.restore()});if(++f<300)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height)})()}
R();
</script></body></html>
